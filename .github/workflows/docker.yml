# Build the OCaml Elm Playground via docker.
# See also Dockerfile at the root of the project.
# coupling: very similar to the docker.yml in syncweb/efuns

name: docker

on:
  pull_request_target: {}
  workflow_dispatch: null
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ocaml:
          - 4.14.4
          # elm_playground_native.opam pins ocaml < 5.2.0 (tsdl); 5.1.1 would
          # be the newest OCaml 5 that satisfies it, add it here once we want
          # CI to also cover OCaml 5.
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "elm_playground" --build-arg OCAML_VERSION=${{matrix.ocaml}} .
